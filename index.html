<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GÖKTÜRK ONLINE V71.3 - GÖK SANCAK</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Metamorphous&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffd700; --bg: #05060a; --card: rgba(15, 20, 30, 0.9); --cyan: #00f2ff; --red: #ff3e3e; --green: #2ecc71; --legend: #ff00ff; }
        * { box-sizing: border-box; font-family: 'Cinzel', serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: #f0f0f0; height: 100vh; overflow: hidden; }

        /* ARKA PLAN GÖKTÜRK BAYRAĞI */
        .gok-bayrak { 
            position: fixed; inset: 0; pointer-events: none; z-index: 0; 
            background: url('https://upload.wikimedia.org/wikipedia/commons/thumb/e/e4/Flag_of_the_G%C3%B6kt%C3%BCrks.svg/1200px-Flag_of_the_G%C3%B6kt%C3%BCrks.svg.png') no-repeat center;
            background-size: 80%; opacity: 0.08; filter: drop-shadow(0 0 20px var(--cyan)); 
        }

        #global-announcement { position:fixed; top:-100px; left:0; width:100%; background:linear-gradient(90deg, transparent, var(--red), transparent); padding:10px; text-align:center; font-weight:bold; z-index:11000; transition:0.5s; text-shadow: 0 0 10px white; border-bottom: 2px solid var(--gold); }
        #hakan-buyrugu { background:rgba(30, 10, 10, 0.95); color:var(--gold); font-size:10px; text-align:center; padding:8px; border-bottom: 2px solid #444; z-index: 1000; position: relative; }

        .container { width: 100%; max-width: 450px; height: 100vh; margin: auto; display: flex; flex-direction: column; background: rgba(0,0,0,0.8); position: relative; border-left: 1px solid #333; border-right: 1px solid #333; z-index: 1; }
        .header { padding: 15px; background: #000; border-bottom: 2px solid var(--gold); display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; font-size: 11px; text-align: center; font-weight: bold; }
        .card { background: var(--card); border: 1px solid #444; padding: 15px; border-radius: 15px; margin-bottom: 12px; backdrop-filter: blur(10px); position: relative; overflow: hidden; }
        .panel { display: none; padding: 20px; height: calc(100vh - 180px); overflow-y: auto; padding-bottom: 100px; }
        .active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .btn-gold { background: linear-gradient(135deg, #ffd700, #b8860b); color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: 900; width: 100%; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 0 #7a5c00; }
        .btn-gold:active { transform: translateY(2px); box-shadow: 0 2px 0 #7a5c00; }
        
        /* ADMİN PANELLERİ AYRI RENKLER */
        .admin-box { border: 1px solid var(--red); background: rgba(50, 0, 0, 0.2); margin-top: 10px; padding: 12px; border-radius: 12px; }
        .admin-box.event { border-color: var(--cyan); background: rgba(0, 50, 50, 0.2); }
        .admin-box.hazine { border-color: var(--legend); background: rgba(50, 0, 50, 0.2); }
        .admin-title { font-size: 11px; font-weight: bold; margin-bottom: 8px; text-align: center; border-bottom: 1px solid currentColor; padding-bottom: 4px; }

        .inv-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .slot { aspect-ratio: 1; background: rgba(255,255,255,0.05); border: 1px solid #333; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .slot.equipped { border: 2px solid var(--cyan); box-shadow: 0 0 10px var(--cyan); }

        .bottom-nav { position: absolute; bottom: 0; width: 100%; display: grid; grid-template-columns: repeat(6, 1fr); height: 80px; background: #000; border-top: 2px solid #222; }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #555; font-size: 9px; }
        .nav-item.active { color: var(--gold); }
        .nav-item i { font-size: 18px; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="gok-bayrak"></div>
<div id="global-announcement">🔱 HAKAN BUYRUĞU</div>

<div id="auth-screen" style="position:fixed; inset:0; background:#000; z-index:9999; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:30px;">
    <h1 style="color:var(--gold); font-family:'Metamorphous';">GÖKTÜRK ONLINE</h1>
    <div class="card" style="width:100%; max-width:350px;">
        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <button onclick="toggleAuth(true)" class="btn-gold">Giriş</button>
            <button onclick="toggleAuth(false)" class="btn-gold" style="background:#222; color:#fff;">Kayıt</button>
        </div>
        <input type="text" id="auth-u" placeholder="Alp Adı" style="width:100%; padding:12px; margin-bottom:10px; background:#111; border:1px solid #444; color:#fff;">
        <input type="password" id="auth-p" placeholder="Şifre" style="width:100%; padding:12px; margin-bottom:15px; background:#111; border:1px solid #444; color:#fff;">
        <div id="reg-fields" style="display:none;"><select id="reg-oba" style="width:100%; padding:12px; background:#111; color:#fff;"><option value="Kayı">Kayı Obası</option><option value="Kınık">Kınık Obası</option></select></div>
        <button onclick="processAuth()" class="btn-gold" style="margin-top:10px;">OTAĞA GİR</button>
    </div>
</div>

<div class="container" id="game-ui" style="display:none;">
    <div id="hakan-buyrugu">🎯 SEFER HEDEFİ: <span id="target-count">0</span>/1000</div>
    <div class="header">
        <div>🪙 <span id="v-gold">0</span></div>
        <div>⚡ <span id="v-en">100</span></div>
        <div>⚔️ <span id="v-pow">0</span></div>
        <div>🎖️ <span id="v-lvl">1</span></div>
    </div>

    <div id="p-home" class="panel active">
        <div class="card" style="text-align:center; border:1px solid var(--gold);">
            <div style="position:relative; width:80px; height:80px; margin:auto;">
                <img id="v-img" src="https://via.placeholder.com/80" style="border-radius:50%; border:2px solid var(--gold);">
                <i class="fas fa-edit" style="position:absolute; bottom:0; right:0; background:var(--gold); color:#000; padding:4px; border-radius:50%; font-size:10px;" onclick="document.getElementById('img-in').click()"></i>
            </div>
            <input type="file" id="img-in" style="display:none" onchange="uploadImg(this)">
            <h3 id="v-name" style="margin:10px 0 0 0;">---</h3>
            <button onclick="doPray()" class="btn-gold" style="background:var(--green); color:#fff; margin-top:10px;">DUA ET (+20 ENERJİ)</button>
        </div>

        <div id="admin-karargah" style="display:none;">
            <div class="admin-box">
                <div class="admin-title" style="color:var(--red);">🔱 HAKAN PANELİ</div>
                <button onclick="adminCmd('gold')" class="btn-gold" style="font-size:10px; margin-bottom:5px;">ALTIN YAĞDIR</button>
                <input type="text" id="adm-duyuru" placeholder="Duyuru..." style="width:100%; padding:8px; background:#000; color:#fff; border:1px solid var(--red);">
                <button onclick="adminCmd('duyuru')" class="btn-gold" style="background:var(--red); color:#fff; margin-top:5px;">FERMAN SAL</button>
            </div>

            <div class="admin-box event">
                <div class="admin-title" style="color:var(--cyan);">🚩 ETKİNLİK PANELİ</div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px;">
                    <button onclick="setEvent('2x_GOLD')" class="btn-gold" style="background:var(--cyan); color:#000; font-size:9px;">2X ALTIN</button>
                    <button onclick="setEvent('2x_EXP')" class="btn-gold" style="background:var(--cyan); color:#000; font-size:9px;">2X TECRÜBE</button>
                    <button onclick="setEvent('EN_FULL')" class="btn-gold" style="background:var(--cyan); color:#000; font-size:9px; grid-column:span 2;">ENEYJİ BAYRAMI (TÜM SERVER)</button>
                </div>
            </div>

            <div class="admin-box hazine">
                <div class="admin-title" style="color:var(--legend);">💎 HAZİNE PANELİ</div>
                <input type="text" id="gift-u" placeholder="Alp Adı" style="width:100%; padding:8px; background:#000; color:#fff; border:1px solid var(--legend);">
                <button onclick="adminGift()" class="btn-gold" style="background:var(--legend); color:#fff; margin-top:5px;">ZÜLFİKAR GÖNDER</button>
            </div>
        </div>
    </div>

    <div id="p-event" class="panel"><div id="sefer-list"></div></div>

    <div id="p-market" class="panel">
        <h3 style="color:var(--gold);">SİLAHHANE</h3>
        <div id="market-items" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;"></div>
        <h3 style="color:var(--cyan); margin-top:20px;">KUTSAL EMANETLER</h3>
        <div id="market-rare" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;"></div>
    </div>

    <div id="p-inv" class="panel">
        <div id="inv-grid" class="inv-grid"></div>
        <div id="inv-det" class="card" style="display:none; margin-top:20px; border-color:var(--gold);"></div>
    </div>

    <div id="p-chat" class="panel">
        <div id="chat-box" style="height:350px; background:rgba(0,0,0,0.5); border:1px solid #333; overflow-y:auto; padding:10px; border-radius:10px;"></div>
        <div style="display:flex; gap:10px; margin-top:15px;">
            <input type="text" id="chat-in" placeholder="Mesaj..." style="flex:1; padding:10px; background:#111; color:#fff; border-radius:8px;">
            <button onclick="sendMsg()" class="btn-gold" style="width:60px;">AT</button>
        </div>
    </div>

    <div id="p-rank" class="panel"><div id="rank-list"></div></div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="showP('p-home',this)"><i class="fas fa-campground"></i><span>Otağ</span></div>
        <div class="nav-item" onclick="showP('p-event',this)"><i class="fas fa-swords"></i><span>Sefer</span></div>
        <div class="nav-item" onclick="showP('p-market',this)"><i class="fas fa-store"></i><span>Pazar</span></div>
        <div class="nav-item" onclick="showP('p-inv',this)"><i class="fas fa-gem"></i><span>Hazine</span></div>
        <div class="nav-item" onclick="showP('p-chat',this)"><i class="fas fa-bolt"></i><span>Yağma</span></div>
        <div class="nav-item" onclick="showP('p-rank',this)"><i class="fas fa-trophy"></i><span>Kürsü</span></div>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyAxXHK-3j-cnoM_7k1svrBJnEqFrvHaAw0",
      authDomain: "gokturkbeta-1.firebaseapp.com",
      projectId: "gokturkbeta-1",
      storageBucket: "gokturkbeta-1.firebasestorage.app",
      messagingSenderId: "859191608412",
      appId: "1:859191608412:web:7f440e39d081ff7e6e5299",
      databaseURL: "https://gokturkbeta-1-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let p = null, isLogin = true;

    const Seferler = [
        {id:1, n:"🐺 Kurt Avı", t:15, r:3000, e:10, i:"🐺"},
        {id:2, n:"🛣️ İpek Yolu", t:60, r:15000, e:20, i:"💰"},
        {id:3, n:"🏰 Bizans Kalesi", t:300, r:100000, e:50, i:"🏰"},
        {id:4, n:"🦅 Ötüken Fethi", t:1200, r:800000, e:100, i:"👑"}
    ];

    const Weapons = [
        {id:1, n:"+5 Kılıç", v:5000, s:200, i:"⚔️"},
        {id:2, n:"+9 Yay", v:50000, s:2000, i:"🏹"},
        {id:3, n:"Zırhlı At", v:150000, s:5000, i:"🐎"}
    ];

    const Rares = [
        {id:10, n:"Göktürk Sancağı", v:750000, s:15000, i:"🚩"},
        {id:100, n:"ZÜLFİKAR", v:0, s:75000, i:"✨", legend:true}
    ];

    function toggleAuth(t) { isLogin = t; document.getElementById('reg-fields').style.display = t ? 'none' : 'block'; }

    function processAuth() {
        let u = document.getElementById('auth-u').value.trim().toLowerCase();
        let pw = document.getElementById('auth-p').value.trim();
        db.ref('players/'+u).once('value', s => {
            if(isLogin) { if(s.val() && s.val().pw === pw) { p = s.val(); loginS(); } else alert("Şifre Yanlış!"); }
            else {
                if(s.val()) return alert("Bu Alp mevcut!");
                p = { u, pw, gold:20000, en:100, lvl:1, oba: document.getElementById('reg-oba').value, inv: [], isAdmin: (u==="ebuinc") };
                if(p.isAdmin) { p.inv.push({...Rares[1], eq:true, uid:1}); p.gold=9999999; }
                db.ref('players/'+u).set(p); loginS();
            }
        });
    }

    function loginS() { document.getElementById('auth-screen').style.display='none'; document.getElementById('game-ui').style.display='flex'; if(p.isAdmin) document.getElementById('admin-karargah').style.display='block'; initGame(); }

    function initGame() {
        db.ref('players/'+p.u).on('value', s => { p = s.val(); upUI(); rInv(); });
        db.ref('announcement').on('value', s => { if(s.val()) showD(s.val()); });
        db.ref('buyruk').on('value', s => { document.getElementById('target-count').innerText = s.val() || 0; });
        db.ref('messages').limitToLast(15).on('value', s => {
            let h = ""; s.forEach(x => { 
                let m=x.val(); 
                h += `<div style="padding:10px; border-bottom:1px solid #222;">
                        <b style="${m.a?'color:var(--gold)':''}">${m.u}:</b> ${m.m}
                        <button onclick="yagmalat('${m.u}')" style="float:right; font-size:8px; background:var(--red); color:white; border:none; padding:3px 6px; border-radius:4px;">YAĞMALA</button>
                      </div>`; 
            });
            document.getElementById('chat-box').innerHTML = h; document.getElementById('chat-box').scrollTop = 9999;
        });
        db.ref('players').on('value', s => {
            let l = []; s.forEach(x => l.push(x.val())); l.sort((a,b)=>b.lvl - a.lvl);
            document.getElementById('rank-list').innerHTML = l.map((u,i)=>`<div class="card"><b>${i+1}. ${u.u}</b> <span style="float:right;">Lvl ${u.lvl}</span></div>`).join('');
        });
        rMarket(); rSefer();
        setInterval(updateTimer, 1000);
    }

    function updateTimer() {
        if(!p.job) { rSefer(); return; }
        let diff = Math.ceil((p.job.end - Date.now()) / 1000);
        if(diff <= 0) {
            p.gold += p.job.r; db.ref('buyruk').transaction(c => (c || 0) + 1);
            delete p.job; upP(); alert("Sefer Başarıyla Tamamlandı!"); rSefer();
        } else {
            document.querySelectorAll('.s-btn').forEach(b => { b.disabled=true; b.innerText = diff + "s Kaldı"; });
        }
    }

    function upUI() {
        document.getElementById('v-gold').innerText = p.gold.toLocaleString();
        document.getElementById('v-en').innerText = p.en;
        document.getElementById('v-lvl').innerText = p.lvl;
        document.getElementById('v-name').innerText = p.u.toUpperCase();
        document.getElementById('v-pow').innerText = 100 + (p.inv?p.inv.filter(x=>x.eq).reduce((a,b)=>a+b.s,0):0);
        if(p.pImg) document.getElementById('v-img').src = p.pImg;
    }

    function rSefer() {
        document.getElementById('sefer-list').innerHTML = Seferler.map(s=>`
            <div class="card" style="display:flex; align-items:center; gap:10px;">
                <div style="font-size:25px;">${s.i}</div>
                <div style="flex:1;"><b>${s.n}</b><br><small>${s.r} 🪙 | ${s.e} ⚡</small></div>
                <button onclick="startS(${s.id})" class="btn-gold s-btn" style="width:100px; font-size:9px;">SEFERE ÇIK</button>
            </div>`).join('');
    }

    function startS(id) {
        if(p.job) return;
        let s = Seferler.find(x=>x.id===id);
        if(p.en < s.e) return alert("Enerji yetersiz!");
        p.en -= s.e; p.job = { end: Date.now() + (s.t*1000), r: s.r }; upP();
    }

    function rMarket() {
        document.getElementById('market-items').innerHTML = Weapons.map(i=>`<div class="card" onclick="buy(${i.id},'w')">${i.i}<br><b>${i.n}</b><br><small>${i.v} 🪙</small></div>`).join('');
        document.getElementById('market-rare').innerHTML = Rares.filter(x=>!x.legend).map(i=>`<div class="card" onclick="buy(${i.id},'r')">${i.i}<br><b>${i.n}</b><br><small>${i.v} 🪙</small></div>`).join('');
    }

    function buy(id, type) {
        let i = type==='w' ? Weapons.find(x=>x.id===id) : Rares.find(x=>x.id===id);
        if(confirm(i.n + " satın almak istediğine emin misin Alpım?")) {
            if(p.gold >= i.v) { p.gold -= i.v; if(!p.inv)p.inv=[]; p.inv.push({...i, uid:Date.now(), eq:false}); upP(); }
            else alert("Altının yetersiz!");
        }
    }

    function yagmalat(target) {
        if(target === p.u) return;
        db.ref('players/'+target).once('value', s => {
            let t = s.val();
            let myPow = 100 + (p.inv?p.inv.filter(x=>x.eq).reduce((a,b)=>a+b.s,0):0);
            let targetPow = 100 + (t.inv?t.inv.filter(x=>x.eq).reduce((a,b)=>a+b.s,0):0);
            if(myPow > targetPow) {
                let calinan = Math.floor(t.gold * 0.05); t.gold -= calinan; p.gold += calinan;
                db.ref('players/'+target).set(t); upP(); alert(target + " yağmalandı! " + calinan + " altın aldın.");
            } else alert("Gücün yetmedi!");
        });
    }

    function rInv() {
        let h = ""; for(let i=0; i<16; i++) { 
            let itm = p.inv?p.inv[i]:null; h += `<div class="slot ${itm?.eq?'equipped':''}" onclick="showInv(${i})">${itm?itm.i:''}</div>`; 
        }
        document.getElementById('inv-grid').innerHTML = h;
    }

    function showInv(idx) {
        let itm = p.inv?p.inv[idx]:null; if(!itm) return;
        let d = document.getElementById('inv-det'); d.style.display="block";
        d.innerHTML = `<b>${itm.n}</b><br><button onclick="eq(${idx})" class="btn-gold" style="font-size:10px;">KUŞAN/ÇIKAR</button><button onclick="sell(${idx})" class="btn-gold" style="background:#333; color:#fff; margin-top:5px; font-size:10px;">SAT</button>`;
    }

    function eq(idx) { p.inv[idx].eq = !p.inv[idx].eq; upP(); }
    function sell(idx) { p.gold += (p.inv[idx].v*0.5); p.inv.splice(idx,1); upP(); }
    function adminCmd(type) { if(type==='gold') p.gold+=1000000; if(type==='duyuru') db.ref('announcement').set(document.getElementById('adm-duyuru').value); upP(); }
    function setEvent(ev) { 
        if(ev==='EN_FULL') {
            db.ref('players').once('value', s => {
                s.forEach(x => { let d=x.val(); d.en=100; db.ref('players/'+d.u).set(d); });
                db.ref('announcement').set("HAKAN ENERJİ DAĞITTI! TÜM ALPLER DİNÇLEŞTİ!");
            });
        } else { db.ref('announcement').set("ETKİNLİK BAŞLADI: " + ev); }
    }
    function adminGift() {
        let u = document.getElementById('gift-u').value.toLowerCase();
        db.ref('players/'+u).once('value', s => {
            if(s.val()){ let td=s.val(); if(!td.inv)td.inv=[]; td.inv.push({...Rares[1], uid:Date.now()}); db.ref('players/'+u).set(td); alert("Gönderildi!"); }
        });
    }
    function sendMsg() { let m = document.getElementById('chat-in').value; if(m){ db.ref('messages').push({u:p.u, m, a:p.isAdmin}); document.getElementById('chat-in').value=""; } }
    function upP() { db.ref('players/'+p.u).set(p); }
    function showP(id, el) { document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active')); document.getElementById(id).classList.add('active'); document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active')); el.classList.add('active'); }
    function showD(m) { let b = document.getElementById('global-announcement'); b.innerText = "🔱 " + m; b.style.top = "0"; setTimeout(()=>b.style.top="-100px", 5000); }
    function uploadImg(el) { let r=new FileReader(); r.onload=e=>{ p.pImg=e.target.result; upP(); }; r.readAsDataURL(el.files[0]); }
    function doPray() { if(p.en <= 80) { p.en += 20; upP(); alert("Dua kabul oldu!"); } }
</script>
</body>
</html>
